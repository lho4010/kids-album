<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 성장 앨범 - 비밀번호 입력</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Cute+Font&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FFB7D5 0%, #C7CEEA 50%, #B5EAD7 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .lock-container {
            background: white;
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .lock-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-family: 'Gamja Flower', cursive;
            font-size: 2.5em;
            color: #FF6BA9;
            margin-bottom: 15px;
        }
        
        .subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 40px;
        }
        
        .input-group {
            margin-bottom: 30px;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 18px 25px;
            font-size: 1.2em;
            border: 3px solid #FFB7D5;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            font-family: inherit;
        }
        
        input[type="password"]:focus {
            border-color: #FF6BA9;
            box-shadow: 0 0 20px rgba(255, 107, 169, 0.3);
        }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 1.2em;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6BA9 0%, #FFB7D5 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 107, 169, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 107, 169, 0.5);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #ff4444;
            margin-top: 15px;
            font-weight: 600;
            display: none;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .hint {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 183, 213, 0.2);
            border-radius: 15px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="lock-container">
        <div class="lock-icon">🔒</div>
        <h1>성장 앨범</h1>
        <p class="subtitle">비밀번호를 입력해주세요</p>
        
        <form id="passwordForm">
            <div class="input-group">
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="비밀번호 입력"
                    autocomplete="off"
                    required
                >
            </div>
            <button type="submit">🔓 열기</button>
            <div class="error-message" id="errorMessage">
                ❌ 비밀번호가 올바르지 않습니다
            </div>
        </form>
        
        <div class="hint">
            💡 힌트: 관리자에게 문의하세요
        </div>
    </div>

    <script>
        // ⚠️ 여기에 비밀번호를 설정하세요 (보안이 완벽하지는 않습니다)
        const CORRECT_PASSWORD = '1234';  // ← 원하는 비밀번호로 변경
        
        // 세션에 로그인 상태 저장
        const SESSION_KEY = 'album_authenticated';
        
        // 이미 로그인되어 있으면 바로 이동
        if (sessionStorage.getItem(SESSION_KEY) === 'true') {
            window.location.href = 'album.html';
        }
        
        // 폼 제출 처리
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (password === CORRECT_PASSWORD) {
                // 로그인 성공
                sessionStorage.setItem(SESSION_KEY, 'true');
                
                // 성공 애니메이션
                document.querySelector('.lock-icon').textContent = '🔓';
                document.querySelector('h1').textContent = '환영합니다!';
                document.querySelector('.subtitle').textContent = '앨범으로 이동합니다...';
                
                // 1초 후 이동
                setTimeout(() => {
                    window.location.href = 'album.html';
                }, 1000);
            } else {
                // 로그인 실패
                errorMessage.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
                
                // 3초 후 에러 메시지 숨기기
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        });
        
        // Enter 키 지원
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('passwordForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
